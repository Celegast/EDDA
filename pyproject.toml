[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edda"
version = "0.3.1"
description = "Elite Dangerous Data Analyser — journal parser, database, and analytics dashboard"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=2.0,<3",
    "pandas>=3.0,<4",
    "seaborn>=0.13,<1",
    "plotly>=6.0,<7",
    "kaleido>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pdm.scripts]
import    = {call = "edda.cli:cmd_import"}
stats     = {call = "edda.cli:cmd_stats"}
trip      = {call = "edda.cli:cmd_trip"}
map       = {call = "edda.cli:cmd_map"}
charts    = {call = "edda.cli:cmd_charts"}
dashboard = {call = "edda.cli:cmd_dashboard"}
